name: affine-local

x-affine: &affine
  image: affine-local:source
  pull_policy: never
  environment:
    REDIS_SERVER_HOST: redis
    DATABASE_URL: postgresql://affine:${POSTGRES_PASSWORD:?请先运行 deploy.ps1}@postgres:5432/affine
    DEPLOYMENT_TYPE: selfhosted
    AFFINE_SERVER_EXTERNAL_URL: ${AFFINE_SERVER_EXTERNAL_URL:-http://localhost:3010}
  volumes:
    - storage:/root/.affine/storage
    - config:/root/.affine/config

services:
  affine:
    <<: *affine
    ports:
      - '127.0.0.1:${AFFINE_PORT:-3010}:3010'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      affine_migration:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3010/info').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    restart: unless-stopped

  affine_migration:
    <<: *affine
    command: ['node', './scripts/self-host-predeploy.js']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-bookworm
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: affine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先运行 deploy.ps1}
      POSTGRES_DB: affine
      POSTGRES_INITDB_ARGS: '--data-checksums'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'affine', '-d', 'affine']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  storage:
  config:
  postgres:
